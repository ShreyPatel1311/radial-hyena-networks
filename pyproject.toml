[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "radial-hyena"
version = "1.0.0"
description = "Radial Hyena networks for property prediction of nanomaterials (CHILI-100K)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torch-geometric>=2.5",
    "numpy>=1.24",
    "scipy>=1.15",
    "scikit-learn>=1.3",
    "h5py>=3.9",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["radial_hyena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
